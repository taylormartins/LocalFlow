# Golden Flow (localflow) configuration TEMPLATE.
#
# install.ps1 copies this to config.toml on first run (or: copy it yourself).
# config.toml is gitignored: it is yours, and may hold your server token.
# Most settings can also be changed from the tray icon's right-click menu.
# Every value here matches a default in src/localflow/config.py; delete a line
# to fall back to that default.

[audio]
# Case-insensitive substring of the input device name.
# Run `uv run localflow devices` to see the list. Leave "" for the Windows default.
# Example: "Scarlett Solo" matches "Microphone (Scarlett Solo USB)"; the
# resolver prefers the WASAPI copy of whichever device matches.
device = ""
# Hard cap on one recording. Generous because toggle mode makes it easy to
# start a recording and get distracted; the capture is truncated, not lost.
max_seconds = 600
min_seconds = 0.35
# Mic boost, also in the tray menu: "none", "low" (+6 dB), "medium" (+12 dB),
# "high" (+18 dB), or "auto": measures each recording and lifts quiet speech
# (up to +26 dB) without turning up an empty room. Never turns anything down.
boost = "auto"
# Extra fixed multiplier applied before the boost. Rarely needed now.
gain = 1.0

[whisper]
# large-v3-turbo is the sweet spot on an NVIDIA GPU: near large-v3 accuracy at
# roughly 4x the speed. Alternatives: "large-v3" (most accurate, slower),
# "distil-large-v3" (English only, faster), "medium.en", "small.en".
# No NVIDIA GPU: model = "small.en" (or "base.en"), device = "cpu",
# compute_type = "int8". install.ps1 sets these for you.
model = "large-v3-turbo"
device = "cuda"
compute_type = "float16"
language = "en"
beam_size = 1
vad_filter = true
# Network blocks huggingface.co? Point at an internal mirror here, or sideload
# the model instead (README: "Locked-down networks").
# hf_endpoint = "https://artifactory.example.com/api/huggingfaceml/hf"

[cleanup]
enabled = true
# "llm"   = Ollama cleanup (best); falls back to the algorithmic rules whenever
#           Ollama or the model is unavailable.
# "rules" = algorithmic cleanup only: filler, stutters, "no wait" corrections,
#           spoken punctuation, casing. No Ollama, no GPU, ~2 ms.
method = "llm"
host = "http://127.0.0.1:11434"
# Head-to-head on a real dictation, warm, nothing else on the GPU:
#   qwen2.5:3b  436ms  but keeps "So", leaves the self-correction unresolved,
#                      and misses spoken "new paragraph"
#   qwen2.5:7b  607ms  resolves all three
# The extra 171ms buys the behaviour that makes this better than raw Whisper,
# so 7b stays the default. Switch to 3b if you want the latency back and mostly
# dictate short, tidy sentences. Both hold at 0/21 on "answered instead of
# cleaned", so the guardrail is not what you trade away.
model = "qwen2.5:7b"
keep_alive = "30m"
min_chars = 12
# Skip the LLM entirely when the transcript has no filler, stutter, spoken
# punctuation, or self-correction. Short crisp dictation then costs 0 ms.
skip_if_clean = true
# Extra house style, appended to the built-in prompt. Keep it short.
instructions = ""

[inject]
# "paste" = clipboard + Ctrl+V (fast, Unicode-safe).
# "type" = simulated keystrokes (slower; use if an app ignores paste).
method = "paste"
restore_clipboard = true
paste_delay = 0.08
# Where the text goes: "focus" = whichever window has focus when it's ready;
# "start" = the window you were in when the dictation began (click around
# while you talk; "submit" presses Enter there too; you're brought back).
# Tray: Paste where I started.
paste_to = "focus"
# Paste into terminals as one line. Windows Terminal stops a multi-line paste
# with a warning, which swallowed long dictations and their "submit".
terminal_single_line = true

[hotkeys]
# pynput syntax: "<f9>", "<ctrl>+<alt>+d", "<ctrl>+<shift>+<space>".
# Named keys always go in angle brackets; plain letters do not.
#
# "toggle" = tap F9 to start, go do other things, tap F9 again to stop.
# "hold"   = push-to-talk; records only while the key is held down.
mode = "toggle"
# Easiest to change from the tray: Dictation keys. A list gives several
# shortcuts that act as one switch; [] = none. Caps Lock is suppressed (stops
# toggling caps; LocalFlow turns caps off at startup if it was left on). Modifier-only chords like Ctrl+Win fire on a
# clean tap, so Ctrl+Win+D/arrows still work and Start never opens.
dictate = ["<caps_lock>", "<ctrl>+<cmd>", "<f9>"]
dictate_raw = ["<shift>+<caps_lock>", "<ctrl>+<cmd>+<shift>", "<f10>"]
# Aborts an in-progress recording without transcribing it. Worth having in
# toggle mode, where a forgotten recording has no other way out. Never
# suppressed, so Escape keeps working normally everywhere else.
cancel = "<esc>"

[server]
# Phone dictation over HTTPS (see README). Off by default: when on, it listens
# on your network, so set a token first.
enabled = false
host = "0.0.0.0"
port = 8123
# Shared secret for the phone. Generate your own and paste it into the PWA's
# settings screen:
#   python -c "import secrets; print(secrets.token_urlsafe(24))"
# Leaving this empty disables auth entirely - only safe if you also set
# host = "127.0.0.1".
token = ""

[overlay]
# Floating pill above the taskbar: live level bars while recording (bright =
# speech, dim = silence), a spinner while transcribing/cleaning, a check when
# the text is pasted. Click-through and never takes focus.
enabled = true
margin = 18
# Per-block RMS that counts as speech (bright bars). Typical room noise ~0.005.
speech_rms = 0.009
# Live transcript under the waveform (display only; pasted text is the full pass).
live_text = true
label_opacity = 0.7        # numbered click labels: 0.3 faint ... 1.0 solid
live_interval = 1.0        # seconds between updates (one GPU Whisper pass each)
live_window = 30.0         # only the newest this-many seconds are re-transcribed
live_context_words = 5     # dimmed words kept from the previous sentence
live_max_words = 30        # hard cap; longer shows "..." + newest words

[sounds]
# Cues when recording starts, stops, and the text is pasted. Pick them from the
# tray menu (Start / Stop / Paste sound - choosing one plays a preview and saves here), or set by hand:
# tick, pop, faint pop, blip, click, chime up, chime down, soft, none, or a .wav path.
# The start cue is silenced out of the recording so Whisper never transcribes it.
enabled = true
start = "tick"
stop = "pop"
paste = "faint pop"   # once the text has been inserted
volume = 0.5

[style]
# Rewrite in a voice and/or emotional tone (pick from the tray; they stack).
character = "none"   # humanize, professional, tech professional, doctor, rogue,
                     # robot, caring mother, defiant worker, or one of yours below
tone = "neutral"     # a Plutchik level: serenity/joy/ecstasy, acceptance/trust/admiration,
                     # apprehension/fear/terror, distraction/surprise/amazement,
                     # pensiveness/sadness/grief, boredom/disgust/loathing,
                     # annoyance/anger/rage, interest/anticipation/vigilance
model = ""           # "" = cleanup model; "gemma4:12B" = stronger voices, ~2.8 s

[style.characters]
# pirate = "a salty pirate captain; nautical slang, gruff but cheerful"

[always_on]
# Hands-free: say a start phrase to dictate, a stop phrase to finish. Set the
# phrases up from the tray (Set up always-on phrases...); they and your voice
# takes live in wake\, on this PC only.
enabled = false
model = "base.en"          # listens for the phrases only; CPU, ~160 MB
idle_stop_seconds = 45.0   # finish on our own after this much silence
voice_sensitivity = 0.25   # 0 strict - 1 loose: how much a phrase may sound unlike
                           # your setup takes (raise it if the log says "vetoed")
command_window = 5.0       # a command after a dictation counts this long after the
                           # stop phrase, and again after the text is pasted
command_mode_seconds = 30.0  # command mode ends after this long without a command
command_llm = true         # command mode asks the cleanup LLM (if in use) about
                           # requests the built-in commands don't cover
do_words = ["do"]          # "<start phrase> do enter": one command, no command mode
quick = false              # quick mode: "<start> continue send" in one breath
quick_stop = ["over"]      # quick mode's end word (last word before a pause)
quick_send = ["send"]      # ...and the one that also presses Enter
code_words = []            # quick mode shorthand, "word = command": ["go = submit"]

[always_on.commands]
# Extra spellings for voice commands, added to the built-in ones (names and
# built-ins in commands.py). Example:
# submit = ["fire away"]

[camera]
# Camera mode, part one: which screen you're looking at (Settings > Camera).
# Needs camera support: uv sync --no-dev --inexact --extra camera. Frames are
# read, turned into a direction and dropped; only the calibration is saved.
enabled = false
cameras = ["0:1"]          # camera:screen it sits on, e.g. ["0:1", "1:2"]
gate_start = true          # the start phrase counts only while you look at a screen
hold_commands = true       # command mode stays open while you look at a screen
fps = 10.0

[history]
# Every dictation is saved to history.jsonl (this PC only) for tray >
# Dictation history... Turn off to save nothing.
enabled = true
max_items = 500

[vocabulary]
# Proper nouns and jargon Whisper tends to mangle. These are fed to Whisper as
# a decoding hint and to the cleanup model as a spelling authority.
terms = [
  # "Kubernetes",
  # "PostgreSQL",
  # "Your Company Name",
]

# Literal spoken -> written fixes applied last, after cleanup.
[vocabulary.replacements]
"local flow" = "LocalFlow"
"golden flow" = "Golden Flow"

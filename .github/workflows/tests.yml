name: tests

# The no-window suites on a real Mac and a real Windows machine, on every
# push: proves the code imports and the logic holds on both. Screens,
# keyboards and permission prompts still need a person (see HANDOFF.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --no-dev --inexact
      - name: Every module imports
        run: |
          uv run python - <<'EOF'
          import importlib, pkgutil, sys
          import localflow
          mods = [m.name for m in pkgutil.walk_packages(localflow.__path__, "localflow.")]
          if sys.platform != "darwin":
              mods = [m for m in mods if not m.startswith("localflow.mac")]
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as exc:
                  bad.append(f"{m}: {exc!r}")
          print(f"{len(mods) - len(bad)} of {len(mods)} modules import")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          EOF
      - name: Suites (no windows, no models)
        run: |
          failed=0
          for t in learning quick_mode edit_commands live_stop command_phrases \
                   enroll_redraw ollama_health layouts camera_mode settings_apply; do
            echo "== $t"
            if ! uv run python tests/$t.py; then failed=1; fi
          done
          exit $failed
      - name: Mac pieces on a real Mac (overlay windows, screens, apps, clipboard)
        if: runner.os == 'macOS'
        run: uv run python tests/mac_smoke.py
      - name: The whole app starts, shows its overlay and menu-bar icon, and quits
        if: runner.os == 'macOS'
        run: |
          cat > ci.toml <<'EOF'
          [whisper]
          model = "tiny.en"
          [cleanup]
          method = "rules"
          [always_on]
          enabled = false
          EOF
          uv run python -m localflow.cli run -c ci.toml &
          pid=$!
          for i in $(seq 1 60); do
            grep -q "overlay ready" localflow.log 2>/dev/null && break
            sleep 2
          done
          sleep 5
          touch .quit
          for i in $(seq 1 30); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          echo "---- localflow.log"; cat localflow.log
          ! kill -0 $pid 2>/dev/null || { echo "didn't quit"; kill $pid; exit 1; }
          grep -q "overlay ready" localflow.log || { echo "no overlay"; exit 1; }
          grep -q "shut down" localflow.log || { echo "no clean shutdown"; exit 1; }
          ! grep -E "Traceback|ERROR|overlay failed" localflow.log
